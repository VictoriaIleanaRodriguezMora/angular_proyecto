<p>students-page works!</p>
<!-- Dentro de las comillas, va una expresión de JS -->
<p 
[ngClass]="false ? 'success' : 'error'"
[ngStyle]="{fontSize: 40 + 'px'}"
>
    students-page works!
</p>

<!-- la directiva pisa el valor del ngClass -->
<p 
appRounded 
[ngClass]="{error: hayError, success: !hayError}"
[ngStyle]="{fontSize: myFontSize + 'px'}"
>
    students-page works!
</p>

<div appRounded>usando la directiva</div>
